name: leo_app
description: Leo — Find Jobs. Hire Talent. Build Future.
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # HTTP
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1

  # WebSocket (chat)
  socket_io_client: ^2.0.3+1

  # Secure local storage (tokens)
  flutter_secure_storage: ^9.0.0

  # Firebase (push notifications)
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10

  # UI
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  lottie: ^3.0.0
  image_picker: ^1.0.7
  file_picker: ^6.1.1
  pin_code_fields: ^8.0.1
  intl_phone_field: ^3.2.0
  country_picker: ^2.0.20

  # Maps & location
  google_maps_flutter: ^2.5.3
  geolocator: ^10.1.0
  geocoding: ^2.1.1

  # Audio (voice messages)
  record: ^5.0.4
  just_audio: ^0.9.36
  audio_waveforms: ^1.0.5

  # Utilities
  intl: ^0.19.0
  timeago: ^3.6.0
  uuid: ^4.2.2
  permission_handler: ^11.2.0
  share_plus: ^7.2.1
  url_launcher: ^6.2.4
  package_info_plus: ^5.0.1
  connectivity_plus: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
