# ── Deployment ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: leo-api
  namespace: leo-production
  labels:
    app: leo-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: leo-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0          # zero-downtime rolling deploy
  template:
    metadata:
      labels:
        app: leo-api
    spec:
      containers:
        - name: api
          image: YOUR_ECR_URI/leo-backend:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: leo-api-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
      terminationGracePeriodSeconds: 30

---
# ── Service ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: leo-api-svc
  namespace: leo-production
spec:
  selector:
    app: leo-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP

---
# ── Ingress (Nginx) ──────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: leo-api-ingress
  namespace: leo-production
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.leo.app
      secretName: leo-api-tls
  rules:
    - host: api.leo.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: leo-api-svc
                port:
                  number: 80

---
# ── HorizontalPodAutoscaler ──────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: leo-api-hpa
  namespace: leo-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: leo-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
