version: '3.9'

services:
  # ── API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      target: builder          # use the builder stage in dev (hot reload)
    command: npm run start:dev
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      ELASTICSEARCH_NODE: http://elasticsearch:9200
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # ── PostgreSQL ──────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:15-3.3-alpine
    environment:
      POSTGRES_DB: leo_db
      POSTGRES_USER: leo_user
      POSTGRES_PASSWORD: strong_password_here
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U leo_user -d leo_db']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Redis ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Elasticsearch ───────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - '9200:9200'
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -s http://localhost:9200/_cluster/health | grep -q "status"']
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  # ── Kibana (optional — ES dashboard for dev) ────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.1
    ports:
      - '5601:5601'
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    profiles: ['tools']        # only starts with: docker compose --profile tools up

volumes:
  postgres_data:
  redis_data:
  es_data:
